# Production stack for the M7 server. Standalone: the laptop's dev compose file is not in this repository.
# Rules (scripts\check-prod-stack.ps1 enforces them): no published ports on any service, every image pinned to a version, mem_limit on every service.
# Why no ports: Docker publishes past the host firewall. Admin UIs are reached over Tailscale with an SSH tunnel to the fixed IPs below:
#   ssh -L 5678:172.30.0.10:5678 -L 8025:172.30.0.11:8025 ubuntu@m7-server
# No postgres-backup service: it leaves plaintext dumps on disk. infra/backup-offsite.sh pipes pg_dump straight into age instead.
# Start: docker compose -f docker-compose.prod.yml up -d (infra/bootstrap.sh does this).
name: m7

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.6
    container_name: n8n
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Workflows cannot read the environment (M7b-3). Their config is in the n8n data tables stripe_config and stripe_heartbeat,
      # the Stripe signing secret in the crypto credential "Stripe webhook secret". Nothing secret is passed to n8n as a variable.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      # The key comes from a file, so it is in no process environment and not in docker inspect. infra/bootstrap.sh writes the file
      # from .env (owner uid 1000, mode 400). Without an explicit key n8n would generate one inside its volume.
      - N8N_ENCRYPTION_KEY_FILE=/run/secrets/n8n_encryption_key
      # Public through cloudflared since M7b-5b. cloudflared is exactly one proxy hop, so n8n takes the client IP from X-Forwarded-For.
      # N8N_WEBHOOK_URL, not WEBHOOK_URL: 2.45.6 logs the old name as deprecated at start.
      - N8N_WEBHOOK_URL=https://invoice.mahmud-alhussen.de/
      - N8N_PROXY_HOPS=1
      # In 2.45.6 the /api/v1 routes stay mounted either way (server.js); this flag only turns off API-key auth and key creation,
      # and the Swagger UI has its own flag. What keeps /api off the internet is the tunnel allowlist and the WAF rule.
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=true
      # Execution pruning, explicit (M7b-7; 2.45.6 already prunes by default at 336 h / 10,000). Since M7c the workflows that see visitor
      # data save no successful executions, and failed ones are kept at most 48 h: the Datenschutz page promises that limit for the visitor
      # data in error logs. Enough for triage (alerts arrive within minutes); keeps database.sqlite, the backup and the exports small.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=48
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
    secrets:
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - mailpit
    networks:
      default:
        ipv4_address: 172.30.0.10

  postgres:
    image: postgres:17.11-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - POSTGRES_USER=automation
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=automation
    command: postgres -c shared_buffers=64MB
    volumes:
      - pg_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: mailpit
    restart: unless-stopped
    mem_limit: 128m
    networks:
      default:
        ipv4_address: 172.30.0.11

  gotenberg:
    # Same flags as the laptop. Swap capped to the memory limit, so a runaway render is killed instead of swapping the VM.
    image: gotenberg/gotenberg:8.39.0-chromium
    container_name: gotenberg
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command:
      - gotenberg
      - --chromium-disable-javascript
      - --webhook-disable
      - --api-timeout=30s

  demo-web:
    # The visitor demo (M7c): static pages from git (demo/site, read-only) and exactly two API paths proxied to n8n (infra/Caddyfile).
    # Third allowlist layer after the WAF and cloudflared. Admin API and automatic HTTPS are off: TLS ends at Cloudflare.
    image: caddy:2.10.2-alpine
    container_name: demo-web
    restart: unless-stopped
    mem_limit: 48m
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./demo/site:/srv:ro
    depends_on:
      - n8n
    networks:
      default:
        ipv4_address: 172.30.0.12

  cloudflared:
    # Dials out to Cloudflare, so nothing listens on the public IP. Ingress rules (the path allowlist) are in git: infra/cloudflared.yml.
    # Runs as uid 65532 (the image's user): infra/bootstrap.sh gives it the credentials file, mode 400.
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./infra/cloudflared.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - cloudflared_credentials
    depends_on:
      - n8n

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  n8n_data:
  pg_data:

secrets:
  n8n_encryption_key:
    # Written by infra/bootstrap.sh from N8N_ENCRYPTION_KEY in .env. Never in git (secrets/ is ignored).
    file: ./secrets/n8n_encryption_key
  cloudflared_credentials:
    # The tunnel's credentials JSON, copied by the owner from Bitwarden. Never in git.
    file: ./secrets/cloudflared.json
